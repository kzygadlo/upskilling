version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskmanager-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong@Password123"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - taskmanager-network

  # API (.NET 9)
  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: taskmanager-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TaskManagerDb;User Sa=sa;Password=YourStrong@Password123;TrustServerCertificate=True;"
    ports:
      - "5000:8080"
    depends_on:
      - sqlserver
    networks:
      - taskmanager-network
    volumes:
      - ./Backend:/app

  # Frontend (Angular)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: taskmanager-frontend
    ports:
      - "4200:4200"
    environment:
      API_URL: "http://api:8080"
    depends_on:
      - api
    networks:
      - taskmanager-network
    volumes:
      - ./Frontend:/app
      - /app/node_modules

volumes:
  sqlserver-data:

networks:
  taskmanager-network:
    driver: bridge
